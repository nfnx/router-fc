[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rethos-request-router"
version = "0.1.0"
description = "SkillRet retrieval, one-pass skill/intent review, and benchmark-based harness/model routing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
embedding = ["torch>=2.7", "transformers>=5.5,<6"]

[project.scripts]
rethos-router = "rethos_router.__main__:main"

[tool.setuptools.packages.find]
include = ["rethos_router*"]
